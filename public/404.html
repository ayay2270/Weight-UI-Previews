<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opening preview…</title></head>
<body><p>Opening the requested preview…</p><script>
  const base = '/Weight-UI-Previews'
  const route = location.pathname.startsWith(base) ? location.pathname.slice(base.length) + location.search + location.hash : '/'
  try { sessionStorage.setItem('weight-ui-pages-route', route || '/') } catch {}
  location.replace(base + '/')
</script></body>
</html>
